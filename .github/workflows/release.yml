# Push a tag like v1.2.0 → builds a signed APK and a macOS .dmg and publishes them as a GitHub release.
# The apps check releases/latest (shared/.../data/Update.kt) and offer the update.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest # the .dmg needs macOS; the APK builds here too
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          ./gradlew :app:assembleRelease :shared:packageDmg \
            -PappVersion="${GITHUB_REF_NAME#v}" \
            -Ponlyheat.keystore="$RUNNER_TEMP/release.jks" \
            -Ponlyheat.keystorePassword="$KEYSTORE_PASSWORD"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk OnlyHeat.apk
          gh release create "$GITHUB_REF_NAME" OnlyHeat.apk shared/build/compose/binaries/main/dmg/*.dmg --generate-notes
